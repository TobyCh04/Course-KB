courses:
  SYSEN 5100:
    name: "Model-Based Systems Engineering"
    semester: "Fall 2026"
    credits: 4
    lectures: 28
    textbook: "Systems Engineering Handbook"
    topics:
      - systems engineering fundamentals
      - requirements analysis
      - system architecture
      - trade studies
      - verification and validation
      - model-based systems engineering

  SYSEN 5930:
    name: "Systems Engineering Project Management"
    semester: "Fall 2026"
    credits: 3
    lectures: 28
    topics:
      - project planning
      - risk management
      - earned value management
      - agile methods
      - team dynamics

  ORIE 5100:
    name: "Introduction to Engineering Probability"
    semester: "Fall 2026"
    credits: 4
    lectures: 28
    topics:
      - probability theory
      - random variables
      - distributions
      - expectation
      - limit theorems
      - statistical inference

  SYSEN 5400:
    name: "Theory and Practice of Systems Architecture"
    semester: "Spring 2027"
    credits: 3
    lectures: 28
    topics:
      - architecture frameworks
      - stakeholder needs
      - concept generation
      - concept selection
      - architecture patterns

  SYSEN 5211:
    name: "Systems Analysis and Optimization"
    semester: "Spring 2027"
    credits: 3
    lectures: 28
    topics:
      - linear programming
      - integer programming
      - optimization methods
      - sensitivity analysis

  SYSEN 6800:
    name: "Data Science for Systems Engineering"
    semester: "Spring 2027"
    credits: 3
    lectures: 28
    topics:
      - machine learning
      - deep learning
      - data pipelines
      - model evaluation

  SYSEN 6888:
    name: "Deep Learning"
    semester: "Spring 2027"
    credits: 3
    lectures: 28
    topics:
      - neural networks
      - CNNs
      - RNNs
      - transformers
      - generative models

  SYSEN 5530:
    name: "Foundations of Data Science"
    semester: "Spring 2027"
    credits: 3
    lectures: 28
    topics:
      - exploratory data analysis
      - regression
      - classification
      - clustering
      - dimensionality reduction
